<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tetris</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    canvas {
      background: black;
      border: 4px solid white;
    }
  </style>
</head>
<body>

<canvas id="game" width="300" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const COLS = 10;
const ROWS = 20;
const SIZE = 30;

const board = [];

for (let y = 0; y < ROWS; y++) {
  board[y] = [];

  for (let x = 0; x < COLS; x++) {
    board[y][x] = 0;
  }
}

const colors = [
  null,
  "#00FFFF",
  "#0000FF",
  "#FF7F00",
  "#FFFF00",
  "#00FF00",
  "#800080",
  "#FF0000"
];

function createPiece(type) {
  if (type === "T") {
    return [
      [0,1,0],
      [1,1,1],
      [0,0,0]
    ];
  }

  if (type === "O") {
    return [
      [2,2],
      [2,2]
    ];
  }

  if (type === "L") {
    return [
      [0,3,0],
      [0,3,0],
      [0,3,3]
    ];
  }

  if (type === "J") {
    return [
      [0,4,0],
      [0,4,0],
      [4,4,0]
    ];
  }

  if (type === "I") {
    return [
      [0,5,0,0],
      [0,5,0,0],
      [0,5,0,0],
      [0,5,0,0]
    ];
  }

  if (type === "S") {
    return [
      [0,6,6],
      [6,6,0],
      [0,0,0]
    ];
  }

  if (type === "Z") {
    return [
      [7,7,0],
      [0,7,7],
      [0,0,0]
    ];
  }
}

function drawCell(x, y, color) {
  ctx.fillStyle = color;

  ctx.fillRect(
    x * SIZE,
    y * SIZE,
    SIZE,
    SIZE
  );

  ctx.strokeStyle = "#111";

  ctx.strokeRect(
    x * SIZE,
    y * SIZE,
    SIZE,
    SIZE
  );
}

function drawBoard() {
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (board[y][x] !== 0) {
        drawCell(x, y, colors[board[y][x]]);
      }
    }
  }
}

function drawPiece() {
  player.matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        drawCell(
          x + player.pos.x,
          y + player.pos.y,
          colors[value]
        );
      }
    });
  });
}

function draw() {
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawBoard();
  drawPiece();
}

function collide() {
  for (let y = 0; y < player.matrix.length; y++) {
    for (let x = 0; x < player.matrix[y].length; x++) {

      if (
        player.matrix[y][x] !== 0 &&
        (
          board[y + player.pos.y] &&
          board[y + player.pos.y][x + player.pos.x]
        ) !== 0
      ) {
        return true;
      }
    }
  }

  return false;
}

function merge() {
  player.matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        board[y + player.pos.y][x + player.pos.x] = value;
      }
    });
  });
}

function playerDrop() {
  player.pos.y++;

  if (collide()) {
    player.pos.y--;

    merge();

    clearLines();

    playerReset();
  }

  dropCounter = 0;
}

function playerMove(dir) {
  player.pos.x += dir;

  if (collide()) {
    player.pos.x -= dir;
  }
}

function rotate(matrix) {
  return matrix[0].map((_, index) =>
    matrix.map(row => row[index]).reverse()
  );
}

function playerRotate() {
  const rotated = rotate(player.matrix);

  const old = player.matrix;

  player.matrix = rotated;

  if (collide()) {
    player.matrix = old;
  }
}

function clearLines() {
  outer:
  for (let y = ROWS - 1; y >= 0; y--) {

    for (let x = 0; x < COLS; x++) {

      if (board[y][x] === 0) {
        continue outer;
      }
    }

    const row = board.splice(y, 1)[0].fill(0);

    board.unshift(row);

    y++;
  }
}

function playerReset() {
  const pieces = "TJLOSZI";

  const type =
    pieces[Math.floor(Math.random() * pieces.length)];

  player.matrix = createPiece(type);

  player.pos.y = 0;

  player.pos.x =
    Math.floor(COLS / 2) -
    Math.floor(player.matrix[0].length / 2);

  if (collide()) {
    for (let y = 0; y < ROWS; y++) {
      board[y].fill(0);
    }
  }
}

const player = {
  pos: {
    x: 0,
    y: 0
  },

  matrix: null
};

let dropCounter = 0;
let dropInterval = 700;
let lastTime = 0;

function update(time = 0) {

  const delta = time - lastTime;

  lastTime = time;

  dropCounter += delta;

  if (dropCounter > dropInterval) {
    playerDrop();
  }

  draw();

  requestAnimationFrame(update);
}

document.addEventListener("keydown", event => {

  if (event.key === "ArrowLeft") {
    playerMove(-1);
  }

  else if (event.key === "ArrowRight") {
    playerMove(1);
  }

  else if (event.key === "ArrowDown") {
    playerDrop();
  }

  else if (
    event.key === "ArrowUp" ||
    event.key === " "
  ) {
    playerRotate();
  }
});

playerReset();
update();
</script>

</body>
</html>
